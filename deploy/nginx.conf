# /etc/nginx/sites-available/dev-opensource
# dev-opensource 静态站点 Nginx 配置示例
# 站点根目录：/var/www/dev-opensource（VitePress 构建产物 .vitepress/dist）

server {
    listen 80;
    listen [::]:80;
    server_name opensource.example.com;

    root /var/www/dev-opensource;
    index index.html;

    # VitePress cleanUrls：/home/torvalds -> /home/torvalds.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 静态资源长缓存（VitePress 的 assets/ 文件名带内容哈希）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    access_log /var/log/nginx/dev-opensource.access.log;
    error_log  /var/log/nginx/dev-opensource.error.log;
}

# 启用方式：
#   sudo ln -s /etc/nginx/sites-available/dev-opensource /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS 配置见 certbot.md（deploy/certbot.md）
